<span class="au-pill au-pill--{{ status() }}">
  <svg viewBox="0 0 10 10" aria-hidden="true">
    @switch (status()) {
      @case ('critical') {
        <path d="M5 0.5 9.6 9.3H0.4z" />
      }
      @case ('warning') {
        <path d="M5 0 10 5 5 10 0 5z" />
      }
      @case ('stable') {
        <circle cx="5" cy="5" r="4.5" />
      }
      @case ('info') {
        <rect x="1" y="1" width="8" height="8" rx="1.5" />
      }
    }
  </svg>
  <ng-content />
</span>
