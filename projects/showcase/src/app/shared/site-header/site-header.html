<header class="site-header">
  <a class="site-header__logo" routerLink="/">
    <img [src]="markSrc()" alt="" width="32" height="32" />
    <span class="site-header__wordmark">
      <span class="site-header__wordmark-primary">Aurora</span>
      <span class="site-header__wordmark-secondary">Hospital</span>
    </span>
  </a>

  <button
    type="button"
    class="site-header__menu-toggle"
    [attr.aria-expanded]="isMenuOpen()"
    aria-controls="site-nav"
    [attr.aria-label]="isMenuOpen() ? 'Close menu' : 'Open menu'"
    (click)="toggleMenu()"
  >
    @if (isMenuOpen()) {
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="6" y1="6" x2="18" y2="18" />
        <line x1="6" y1="18" x2="18" y2="6" />
      </svg>
    } @else {
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    }
  </button>

  <nav id="site-nav" class="site-header__nav" [class.is-open]="isMenuOpen()">
    <a routerLink="/demo" routerLinkActive="is-active" (click)="closeMenu()">Demo</a>
    <a routerLink="/playground" routerLinkActive="is-active" (click)="closeMenu()">Playground</a>
    <a routerLink="/case-study" routerLinkActive="is-active" (click)="closeMenu()">Case study</a>
    <a href="https://github.com/elviomarcos1/aurora-ui" target="_blank" rel="noopener" (click)="closeMenu()">GitHub</a>
    <a
      href="https://elviomarcos1.github.io/aurora-ui/storybook/"
      target="_blank"
      rel="noopener"
      (click)="closeMenu()"
    >
      Storybook
    </a>
    <au-button variant="secondary" (click)="themeService.toggleTheme()">
      @if (themeService.theme() === 'dark') {
        <svg
          class="site-header__theme-icon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2" />
          <path d="M12 20v2" />
          <path d="m4.93 4.93 1.41 1.41" />
          <path d="m17.66 17.66 1.41 1.41" />
          <path d="M2 12h2" />
          <path d="M20 12h2" />
          <path d="m6.34 17.66-1.41 1.41" />
          <path d="m19.07 4.93-1.41 1.41" />
        </svg>
      } @else {
        <svg
          class="site-header__theme-icon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
      }
      {{ themeService.theme() === 'dark' ? 'Light mode' : 'Dark mode' }}
    </au-button>
  </nav>
</header>
