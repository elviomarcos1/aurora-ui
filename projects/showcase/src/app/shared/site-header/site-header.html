<header class="site-header">
  <a class="site-header__logo" routerLink="/">
    <img src="assets/brand/aurora-wordmark.svg" alt="Aurora Hospital" height="32" />
  </a>
  <nav class="site-header__nav">
    <a routerLink="/demo" routerLinkActive="is-active">Demo</a>
    <a routerLink="/playground" routerLinkActive="is-active">Playground</a>
    <a href="https://github.com/elviomarcos1/aurora-ui" target="_blank" rel="noopener">GitHub</a>
    <a href="https://github.com/elviomarcos1/aurora-ui/tree/main/storybook-static" target="_blank" rel="noopener">Storybook</a>
    <au-button variant="ghost" (click)="themeService.toggleTheme()">
      {{ themeService.theme() === 'dark' ? 'Light mode' : 'Dark mode' }}
    </au-button>
  </nav>
</header>
