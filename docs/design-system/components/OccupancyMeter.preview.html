<!-- @dsCard group="Clinical data" height=200 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>OccupancyMeter — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>html,body{margin:0;background:var(--surface-0);} body{padding:16px;} </style></head>
<body class="au-root">
<div class="au-card" style="padding:16px;display:grid;gap:16px;">
  <div class="au-meter"><div class="au-meter__head"><span>Ward 4B · Cardiology</span><span class="au-meter__count">18/24</span></div><div class="au-meter__track" role="meter" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" aria-label="Ward 4B occupancy"><div class="au-meter__fill" style="width:75%"></div></div></div>
  <div class="au-meter au-meter--warning"><div class="au-meter__head"><span>ICU</span><span class="au-meter__count">11/12</span></div><div class="au-meter__track" role="meter" aria-valuenow="92" aria-valuemin="0" aria-valuemax="100" aria-label="ICU occupancy"><div class="au-meter__fill" style="width:92%"></div></div></div>
  <div class="au-meter au-meter--critical"><div class="au-meter__head"><span>Emergency</span><span class="au-meter__count">30/30</span></div><div class="au-meter__track" role="meter" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" aria-label="Emergency occupancy"><div class="au-meter__fill" style="width:100%"></div></div></div>
</div>
</body>
</html>
