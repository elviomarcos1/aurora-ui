<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>BedCard — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>html,body{margin:0;background:var(--surface-0);} body{padding:16px;} .au-bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;}</style></head>
<body class="au-root">
<div class="au-bgrid">
  <div class="au-card au-bed au-bed--critical">
    <div class="au-bed__top"><span class="au-bed__code">4B-12</span><span class="au-pill au-pill--critical"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0.5 9.6 9.3H0.4z"/></svg>Critical</span></div>
    <span class="au-bed__name">M. Oliveira, 67</span>
    <div class="au-bed__meta"><span>Post-op cardiac</span><span class="au-num">Day 2</span><span>Visit due 15:00</span></div>
  </div>
  <div class="au-card au-bed au-bed--stable">
    <div class="au-bed__top"><span class="au-bed__code">4B-13</span><span class="au-pill au-pill--stable"><svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4.5"/></svg>Stable</span></div>
    <span class="au-bed__name">A. Santos, 45</span>
    <div class="au-bed__meta"><span>Pneumonia</span><span class="au-num">Day 4</span><span>Visited 09:40</span></div>
  </div>
  <div class="au-card au-bed au-bed--info">
    <div class="au-bed__top"><span class="au-bed__code">4B-14</span><span class="au-pill au-pill--info"><svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="1.5"/></svg>Discharge pending</span></div>
    <span class="au-bed__name">L. Ferreira, 31</span>
    <div class="au-bed__meta"><span>Appendectomy</span><span class="au-num">Day 3</span><span>Discharge 16:30</span></div>
  </div>
  <div class="au-card au-bed au-bed--free">
    <div class="au-bed__top"><span class="au-bed__code">4B-15</span></div>
    <span class="au-bed__name">Available · cleaned 13:10</span>
    <div class="au-bed__meta"><span>Ready for admission</span></div>
  </div>
</div>
</body>
</html>
