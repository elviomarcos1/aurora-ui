name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Build showcase
        run: npm run build:showcase -- --base-href /aurora-ui/

      - name: Build Storybook
        run: npm run build-storybook

      - name: Assemble Pages site
        run: |
          mkdir -p _site/storybook
          cp -r dist/showcase/browser/. _site/
          cp -r storybook-static/. _site/storybook/
          cp _site/index.html _site/404.html

          # The showcase is a client-side SPA: deep routes have no matching
          # file, so GitHub Pages would 404 them. Copy index.html into each
          # route's own folder so GitHub Pages serves it directly as a real
          # 200 response instead of falling back to 404.html.
          for route in playground demo case-study; do
            mkdir -p "_site/$route"
            cp _site/index.html "_site/$route/index.html"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
